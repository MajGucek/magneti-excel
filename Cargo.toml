[package]
name = "magneti_excel"
version = "2.0.0"
edition = "2024"

[[bin]]
name = "client"
path = "src/client/main.rs"

[[bin]]
name = "server"
path = "src/server/main.rs"

[dependencies]
eframe = "0.33.3"
egui_extras = { version = "0.33.3", features = ["image"] }

rfd = "0.17.2"
calamine = "0.33.0"
sqlite = "0.37.0"
rust_xlsxwriter = "0.94.0"
chrono = "0.4.44"
log = "0.4.29"
env_logger = "0.11.10"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
notify = "9.0.0-rc.4"
rouille = "3.6.2"
ureq = { version = "3.3.0", features = ["json"] }
urlencoding = "2.1.3"
tray-icon = "0.24.2"
image = "0.25.10"